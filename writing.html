<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writing Page</title>
    <link rel="stylesheet" href="writing.css">
</head>
<body>
    <!-- ============ 1. HEADING ============ -->
<section class="heading">
  <div class="heading-text">
    <h1>Write your dreams into reality</h1>
    <p>Make the world you dream about real.</p>
  </div>

  <div class="heading-buttons">
    <button id="write" class="pill" type="button">Write</button>
    <button id="finish" class="pill" type="button">Finish</button>
  </div>

  <div class="mini-writer">
    <div class="word-count" id="word-count">
      <span id="words">0</span>/<input id="goal" type="text" inputmode="numeric"
        placeholder="goal" maxlength="6" aria-label="word goal">
      <small>Words</small>
    </div>
    <div class="timer" id="timer">0:00:00</div>
    <div class="writer-animation">
      <img src="assets/character_writing.gif" alt="Pixel animation of a young woman writing on a laptop" width="160" height="160">
    </div>
  </div>
</section>

<!-- ============ 2. ÁREA DE ESCRITA ============ -->
<section class="writing-space">
  <div class="app">
    <div class="toolbar">
      <button data-cmd="italic" title="Italic"><i>I</i></button>
      <button data-cmd="bold" title="Bold"><b>B</b></button>
      <button data-cmd="underline" title="Underline"><u>A</u></button>
      <button id="spell" title="Spell check (British English)">S</button>
    </div>
    <div id="editor" class="editor" contenteditable="true" lang="en-GB" spellcheck="false"
         data-placeholder="Start writing…"></div>
  </div>
  <div id="tip" class="tip"></div>
</section>

<!-- ============ 3. MUSIC PLAYER ============ -->
<section class="music-player-section">
  <div class="intro">
    <p>Messrs Moony, Wormtail, Padfoot and Prongs are proud to present their own</p>
  </div>

  <div class="title"><h2>MUSIC STATION</h2></div>

  <div class="ornaments">
    <div class="lyrics"><img src="assets/lyttmab.png" alt="I love you to the moon and back"></div>
    <div class="butterfly"><img src="assets/black-butterfly.png" alt="Black butterfly"></div>
  </div>

  <div class="cassette">
    <img src="assets/marauders-music-player.png" alt="Cassette player">
  </div>

  <div class="notepad"><ul id="playlist"></ul></div>

  <div class="player" id="music-player">
    <div class="player-buttons">
      <button id="btn-start">▶ Start playlist</button>
      <button id="btn-shuffle">🔀︎ Random</button>
    </div>

    <div class="controls">
      <div id="track-title">Choose a song</div>
      <input type="range" id="progress" value="0" min="0" max="100" step="0.1" aria-label="Progress">
      <div class="times"><span id="current">0:00</span><span id="remaining">-0:00</span></div>

      <div class="transport">
        <button id="prev" aria-label="Previous">⏮</button>
        <button id="play" aria-label="Play / Pause">▶</button>
        <button id="next" aria-label="Next">⏭</button>
      </div>

      <div class="volume">🔈 <input type="range" id="volume" min="0" max="1" step="0.01" value="1" aria-label="Volume"> 🔊</div>
    </div>

    <audio id="audio"></audio>
  </div>
</section>
<script src="typo.js" defer></script>
<script src="script.js" defer></script>
</body>
</html>
